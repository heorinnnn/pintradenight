<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN TRADE NIGHT - Random Slot</title>
    <style>
        :root {
            --bg-color: #0b0b0d;
            --card-bg: #16161a;
            --accent-orange: #FF6B00;
            --text-color: #ffffff;
            --slot-height: 140px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            height: 100vh;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px;
            overflow: hidden;
        }

        .main-wrapper {
            width: 100%;
            max-width: 650px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Header / Logo Section */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 12px;
            margin-top: 10px;
        }

        .font-logo-img {
            width: 95%;
            max-width: 580px;
            height: auto;
            object-fit: contain;
            mix-blend-mode: screen; /* 이미지 어두운 경계선 제거 효과 */
            filter: drop-shadow(0 0 12px rgba(255, 107, 0, 0.6));
            margin-bottom: 24px;
        }

        .main-logo-img {
            width: 250px;
            max-width: 80%;
            height: auto;
            mix-blend-mode: screen; /* 이미지 어두운 경계선 제거 효과 */
            filter: drop-shadow(0 0 20px rgba(255, 107, 0, 0.7));
        }

        /* Slot Machine */
        .slot-container {
            background: linear-gradient(145deg, #1f1f24, #111115);
            border: 4px solid var(--accent-orange);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 0 35px rgba(255, 107, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .reels-frame {
            display: flex;
            gap: 10px;
            background: linear-gradient(180deg, #d4af37 0%, #fff6cd 50%, #aa7c11 100%);
            padding: 12px;
            border-radius: 16px;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.8), 0 6px 15px rgba(0,0,0,0.6);
            width: 100%;
            justify-content: center;
        }

        .reel {
            background: #ffffff;
            flex: 1;
            height: var(--slot-height);
            border-radius: 10px;
            border: 3px solid #000;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 10px 15px rgba(0,0,0,0.4), inset 0 -10px 15px rgba(0,0,0,0.4);
        }

        .reel-strip {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            will-change: transform;
        }

        .slot-item {
            height: 140px;
            min-height: 140px;
            max-height: 140px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #111;
            font-size: 4.2rem;
            font-weight: 900;
            box-sizing: border-box;
        }

        .slot-item img {
            max-width: 85px;
            max-height: 85px;
            object-fit: contain;
        }

        /* Controls */
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            padding: 14px 20px;
            font-size: 1.2rem;
            font-weight: 900;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            box-shadow: 0 5px 0 rgba(0,0,0,0.5);
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.5);
        }

        .btn-spin {
            flex: 2;
            background: linear-gradient(135deg, var(--accent-orange), #e65c00);
            color: #fff;
        }

        .btn-reset {
            flex: 1;
            background: #2a2a30;
            color: #aaa;
            font-size: 1rem;
            border: 2px solid #444;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Status & History */
        .status-box {
            margin-top: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #888;
            height: 25px;
            text-align: center;
        }

        .status-box.win {
            color: var(--accent-orange);
            font-size: 1.4rem;
            text-shadow: 0 0 10px rgba(255, 107, 0, 0.7);
        }

        .history-container {
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px 16px;
            border: 1px solid #2a2a30;
        }

        .history-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #888;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 60px;
            overflow-y: auto;
        }

        .tag {
            background: #222228;
            border: 1.5px solid var(--accent-orange);
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- Header -->
        <header>
            <img src="pintradenightfont.png" alt="PIN TRADE NIGHT" class="font-logo-img">
            <img src="pintradenight.png" alt="Logo" class="main-logo-img">
        </header>

        <!-- Slot Machine -->
        <div class="slot-container">
            <div class="reels-frame">
                <div class="reel"><div class="reel-strip" id="reel1"></div></div>
                <div class="reel"><div class="reel-strip" id="reel2"></div></div>
                <div class="reel"><div class="reel-strip" id="reel3"></div></div>
            </div>

            <div class="status-box" id="statusText">버튼을 눌러 추첨을 시작하세요!</div>

            <div class="controls">
                <button class="btn btn-reset" id="resetBtn">초기화</button>
                <button class="btn btn-spin" id="spinBtn">SPIN</button>
            </div>
        </div>

        <!-- History -->
        <div class="history-container">
            <div class="history-title">
                <span>뽑힌 번호 목록</span>
                <span id="remainingCount">남은 숫자: 20개</span>
            </div>
            <div class="history-tags" id="historyTags"></div>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playSpinSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playWinSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            [261.63, 329.63, 392.00, 523.25].forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + index * 0.1);
                gain.gain.setValueAtTime(0.15, now + index * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + index * 0.1);
                osc.stop(now + index * 0.1 + 0.3);
            });
        }

        // 최대 숫자를 20으로 변경
        const TOTAL_NUMBERS = 20;
        let availableNumbers = Array.from({length: TOTAL_NUMBERS}, (_, i) => i + 1);
        let drawnNumbers = [];
        let isSpinning = false;
        const ITEM_HEIGHT = 140;

        const reelStrips = [
            document.getElementById('reel1'),
            document.getElementById('reel2'),
            document.getElementById('reel3')
        ];
        const spinBtn = document.getElementById('spinBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusText = document.getElementById('statusText');
        const remainingCount = document.getElementById('remainingCount');
        const historyTags = document.getElementById('historyTags');

        function createItemNode(content) {
            const div = document.createElement('div');
            div.className = 'slot-item';
            if (content === 'IMAGE') {
                const img = document.createElement('img');
                img.src = 'pintradenight.png';
                div.appendChild(img);
            } else {
                div.textContent = content;
            }
            return div;
        }

        function initReels() {
            reelStrips.forEach(strip => {
                strip.innerHTML = '';
                strip.style.transition = 'none';
                strip.style.transform = 'translateY(0px)';
                strip.appendChild(createItemNode('IMAGE'));
            });
        }

        function spin() {
            if (isSpinning) return;
            if (availableNumbers.length === 0) {
                statusText.textContent = "모든 숫자가 추첨되었습니다!";
                statusText.className = "status-box win";
                return;
            }

            initAudio();
            isSpinning = true;
            spinBtn.disabled = true;
            resetBtn.disabled = true;
            statusText.textContent = "추첨 중...";
            statusText.className = "status-box";

            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            const targetNumber = availableNumbers.splice(randomIndex, 1)[0];
            drawnNumbers.push(targetNumber);

            const soundInterval = setInterval(playSpinSound, 80);

            reelStrips.forEach((strip, reelIdx) => {
                strip.innerHTML = '';
                strip.style.transition = 'none';
                strip.style.transform = 'translateY(0px)';

                strip.appendChild(createItemNode('IMAGE'));

                const totalItems = 30 + reelIdx * 10; 
                for (let i = 1; i < totalItems; i++) {
                    const isImg = (i % 3 === 0);
                    const randomNum = Math.floor(Math.random() * TOTAL_NUMBERS) + 1;
                    strip.appendChild(createItemNode(isImg ? 'IMAGE' : randomNum));
                }

                strip.appendChild(createItemNode(targetNumber));

                const targetY = totalItems * ITEM_HEIGHT;
                const duration = 2.5 + reelIdx * 0.6;

                setTimeout(() => {
                    strip.style.transition = `transform ${duration}s cubic-bezier(0.15, 0.85, 0.35, 1.0)`;
                    strip.style.transform = `translateY(-${targetY}px)`;
                }, 50);
            });

            setTimeout(() => {
                clearInterval(soundInterval);
                playWinSound();
                statusText.textContent = `당첨 번호: ${targetNumber}!`;
                statusText.className = "status-box win";

                addHistoryTag(targetNumber);
                updateRemainingUI();

                isSpinning = false;
                spinBtn.disabled = false;
                resetBtn.disabled = false;
            }, 3700);
        }

        function addHistoryTag(num) {
            const tag = document.createElement('div');
            tag.className = 'tag';
            tag.textContent = `# ${num}`;
            historyTags.appendChild(tag);
        }

        function updateRemainingUI() {
            remainingCount.textContent = `남은 숫자: ${availableNumbers.length}개`;
        }

        function resetGame() {
            if (isSpinning) return;
            availableNumbers = Array.from({length: TOTAL_NUMBERS}, (_, i) => i + 1);
            drawnNumbers = [];
            historyTags.innerHTML = '';
            statusText.textContent = "버튼을 눌러 추첨을 시작하세요!";
            statusText.className = "status-box";
            initReels();
            updateRemainingUI();
        }

        spinBtn.addEventListener('click', spin);
        resetBtn.addEventListener('click', resetGame);

        initReels();
        updateRemainingUI();
    </script>
</body>
</html>
